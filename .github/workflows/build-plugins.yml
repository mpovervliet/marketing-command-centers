name: Build plugins

on:
  push:
    branches: [main]
    paths:
      - 'skills-source/**'
      - 'plugin-map.json'
      - 'build-plugins.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build plugins (valideert skills, genereert plugins/ en marketplace.json)
        run: python build-plugins.py

      - name: Commit geregenereerde plugins + marketplace.json
        run: |
          git config user.name "marketing-command-centers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add plugins .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in plugins/ of marketplace.json — niets te committen."
          else
            git commit -m "chore: auto-regenerate plugins + marketplace.json [skip ci]"
            git push
          fi
